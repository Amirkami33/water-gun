<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>نبرد آب‌پاش</title>
<style>
:root{--sea:#0a3d5c;--aqua:#2ec4ff;--sun:#ffc531;--ink:#06202f}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:Tahoma,"Vazirmatn",sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 0,#1486b8,var(--sea) 55%,var(--ink));z-index:10;text-align:center;padding:16px}
h1{margin:0;font-size:38px;color:var(--sun);text-shadow:0 4px 0 #b8801a}
p{margin:0;opacity:.85;font-size:15px}
button,input{font:inherit;border:0;border-radius:16px;padding:13px 22px;font-size:18px}
button{background:var(--sun);color:var(--ink);font-weight:bold;box-shadow:0 4px 0 #b8801a}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8801a}
input{text-align:center;width:130px;letter-spacing:8px;direction:ltr;background:#fff;color:var(--ink)}
.row{display:flex;gap:10px;align-items:center}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
#hpw{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:42%;height:12px;background:#0007;border-radius:8px;overflow:hidden}
#hp{height:100%;width:100%;background:var(--aqua);transition:width .15s}
#sc{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));width:100%;text-align:center;font-size:20px;font-weight:bold;text-shadow:0 2px 4px #000}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid #fff;border-radius:50%;opacity:.8}
#fire{position:absolute;right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;background:#ffc531cc;border:4px solid #fff;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink);font-weight:bold}
#jb{position:absolute;width:100px;height:100px;margin:-50px;border-radius:50%;border:3px solid #fff8;display:none}
#jk{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fffb}
#hit{position:fixed;inset:0;background:#ff2d2d;opacity:0;transition:opacity .25s;pointer-events:none;z-index:4}
#msg{position:fixed;top:40%;width:100%;text-align:center;font-size:26px;font-weight:bold;z-index:6;pointer-events:none;text-shadow:0 2px 6px #000}
</style>
</head>
<body>
<div id="menu">
  <h1>نبرد آب‌پاش</h1>
  <p>دو نفره، آنلاین. اول کسی که ۵ بار خیس کنه برنده‌ست</p>
  <button id="mk">ساخت اتاق</button>
  <div class="row"><input id="code" inputmode="numeric" maxlength="4" placeholder="----"><button id="jn">ورود</button></div>
  <p id="st">گوشی رو افقی بگیر</p>
</div>
<div id="hud">
  <div id="hpw"><div id="hp"></div></div>
  <div id="sc">۰ : ۰</div>
  <div id="cross"></div>
  <div id="jb"><div id="jk"></div></div>
  <div id="fire">آب!</div>
</div>
<div id="hit"></div>
<div id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
let conn=null,isHost=false,playing=false,over=false;

/* ---------- صحنه ---------- */
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd3ff);scene.fog=new THREE.Fog(0x8fd3ff,35,90);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,120);cam.rotation.order='YXZ';scene.add(cam);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(ren.domElement);
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
scene.add(new THREE.HemisphereLight(0xffffff,0x4a7a4a,1));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(10,20,5);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshLambertMaterial({color:0x5fb35f}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const B=[[0,0,4,3,4,0xe8a35c],[-10,6,3,2.2,6,0xd64541],[10,-6,3,2.2,6,0x2f86d6],[8,10,5,2,2,0xf4d03f],[-8,-10,5,2,2,0x9b59b6],[0,13,8,1.6,1.6,0x1abc9c],[0,-13,8,1.6,1.6,0x1abc9c],[-16,-2,2,2.5,2,0xe67e22],[16,2,2,2.5,2,0xe67e22]];
B.forEach(([x,z,w,h,d,c])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,h/2,z);scene.add(m)});
const wallM=new THREE.MeshLambertMaterial({color:0xfff2cc});
[[0,-30,60,0],[0,30,60,0],[-30,0,0,60],[30,0,0,60]].forEach(([x,z,w,d])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w||1,3,d||1),wallM);m.position.set(x,1.5,z);scene.add(m)});

/* تفنگ در دست */
const gun=new THREE.Group();
gun.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(.12,.14,.5),new THREE.MeshLambertMaterial({color:0xffc531})),{}));
const tank=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.22,12),new THREE.MeshLambertMaterial({color:0x2ec4ff}));tank.position.set(0,.16,.05);gun.add(tank);
gun.position.set(.28,-.26,-.55);cam.add(gun);

/* حریف */
function mkOpp(){const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,1.3,12),new THREE.MeshLambertMaterial({color:0xff5a5f}));body.position.y=.65;
 const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,12),new THREE.MeshLambertMaterial({color:0xffd9b0}));head.position.y=1.5;
 const gn=new THREE.Mesh(new THREE.BoxGeometry(.12,.14,.5),new THREE.MeshLambertMaterial({color:0xffc531}));gn.position.set(.3,1.1,-.35);
 g.add(body,head,gn);scene.add(g);return g}
const opp=mkOpp();opp.visible=false;
const R={x:0,z:0,y:0,tx:0,tz:0,ty:0};

/* ---------- بازیکن ---------- */
const me={x:0,z:0,yaw:0,pitch:0,hp:100};
let myScore=0,oppScore=0,mv={x:0,y:0},firing=false,lastShot=0;
const spawn=()=>{me.x=0;me.z=isHost?22:-22;me.yaw=isHost?0:Math.PI;me.pitch=0;me.hp=100;hpUI()};
const hpUI=()=>$('hp').style.width=Math.max(me.hp,0)+'%';
const scUI=()=>$('sc').textContent=fa(myScore)+' : '+fa(oppScore);

function collide(){
 me.x=Math.max(-28.5,Math.min(28.5,me.x));me.z=Math.max(-28.5,Math.min(28.5,me.z));
 for(const [x,z,w,h,d] of B){const ox=w/2+.4-Math.abs(me.x-x),oz=d/2+.4-Math.abs(me.z-z);
  if(ox>0&&oz>0){if(ox<oz)me.x+=ox*Math.sign(me.x-x||1);else me.z+=oz*Math.sign(me.z-z||1)}}}

/* ---------- آب ---------- */
const bGeo=new THREE.SphereGeometry(.09,6,6),bMat=new THREE.MeshBasicMaterial({color:0x4fd1ff});
const shots=[];
function addShot(o,d,mine){const m=new THREE.Mesh(bGeo,bMat);m.position.fromArray(o);scene.add(m);
 shots.push({m,v:new THREE.Vector3().fromArray(d).multiplyScalar(30),mine,t:0})}
function shoot(){
 const now=performance.now();if(now-lastShot<90)return;lastShot=now;
 const d=new THREE.Vector3();cam.getWorldDirection(d);
 d.x+=(Math.random()-.5)*.03;d.y+=(Math.random()-.5)*.03;d.normalize();
 const o=[cam.position.x+d.x*.8,cam.position.y-.1+d.y*.8,cam.position.z+d.z*.8];
 addShot(o,d.toArray(),true);send({t:'f',o,d:d.toArray()});
 gun.position.z=-.5;setTimeout(()=>gun.position.z=-.55,50)}
function stepShots(dt){
 for(let i=shots.length-1;i>=0;i--){const s=shots[i],p=s.m.position;
  s.v.y-=7*dt;p.addScaledVector(s.v,dt);s.t+=dt;let dead=s.t>3||p.y<.05||Math.abs(p.x)>30||Math.abs(p.z)>30;
  if(!dead)for(const [x,z,w,h,d] of B)if(Math.abs(p.x-x)<w/2&&Math.abs(p.z-z)<d/2&&p.y<h){dead=true;break}
  if(!dead&&s.mine&&opp.visible&&Math.hypot(p.x-R.x,p.z-R.z)<.5&&p.y>0&&p.y<1.8){dead=true;send({t:'h'})}
  if(dead){scene.remove(s.m);shots.splice(i,1)}}}

/* ---------- شبکه ---------- */
const send=o=>{if(conn&&conn.open)conn.send(o)};
function onData(m){
 if(!m||typeof m!=='object')return;
 if(m.t==='s'&&isFinite(m.x)&&isFinite(m.z)){R.tx=m.x;R.tz=m.z;R.ty=m.y;if(!opp.visible){R.x=m.x;R.z=m.z;opp.visible=true}}
 else if(m.t==='f'&&Array.isArray(m.o)&&Array.isArray(m.d))addShot(m.o,m.d,false);
 else if(m.t==='h'&&playing&&!over){me.hp-=7;hpUI();$('hit').style.opacity=.45;setTimeout(()=>$('hit').style.opacity=0,120);
  if(me.hp<=0){oppScore++;scUI();send({t:'d'});if(oppScore>=5)end(false);else{note('خیس شدی!');spawn()}}}
 else if(m.t==='d'&&!over){myScore++;scUI();if(myScore>=5)end(true);else note('خیسش کردی!')}}
function setup(c){conn=c;c.on('data',onData);
 c.on('close',()=>{if(!over)note('ارتباط قطع شد',true);playing=false});
 const go=()=>start();c.open?go():c.on('open',go)}
function note(t,keep){const e=$('msg');e.textContent=t;if(!keep)setTimeout(()=>{if(e.textContent===t)e.textContent=''},1400)}
function end(win){over=true;firing=false;$('msg').innerHTML=(win?'بردی! 🎉':'باختی 😅')+'<br><button style="pointer-events:auto;margin-top:14px" onclick="location.reload()">بازی دوباره</button>'}
function start(){$('menu').style.display='none';$('hud').style.display='block';spawn();scUI();playing=true}

const st=t=>$('st').textContent=t;
function host(){isHost=true;const code=String(1000+Math.floor(Math.random()*9000));
 const p=new Peer('wgun-'+code);
 p.on('open',()=>{st('کد اتاق: '+code+' — این کد رو به دوستت بده و منتظر بمون');$('mk').disabled=true});
 p.on('connection',setup);
 p.on('error',e=>{if(e.type==='unavailable-id')host();else st('خطا در اتصال: '+e.type)})}
function join(){const code=$('code').value.trim();if(code.length!==4)return st('کد ۴ رقمی رو بنویس');
 st('در حال اتصال...');const p=new Peer();
 p.on('open',()=>{const c=p.connect('wgun-'+code,{reliable:false});setup(c)});
 p.on('error',e=>st(e.type==='peer-unavailable'?'اتاقی با این کد پیدا نشد':'خطا در اتصال: '+e.type))}
$('mk').onclick=host;$('jn').onclick=join;

/* ---------- کنترل لمسی ---------- */
const T={},jb=$('jb'),jk=$('jk');
document.addEventListener('touchstart',e=>{if(!playing||over)return;
 for(const t of e.changedTouches){
  if(t.target.id==='fire'){T[t.identifier]={m:'f'};firing=true}
  else if(t.clientX<innerWidth/2){T[t.identifier]={m:'j',x:t.clientX,y:t.clientY};jb.style.display='block';jb.style.left=t.clientX+'px';jb.style.top=t.clientY+'px'}
  else T[t.identifier]={m:'l',x:t.clientX,y:t.clientY}}
 e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{
 for(const t of e.changedTouches){const o=T[t.identifier];if(!o)continue;
  if(o.m==='j'){let dx=(t.clientX-o.x)/45,dy=(t.clientY-o.y)/45;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
   mv.x=dx;mv.y=dy;jk.style.transform=`translate(${dx*30}px,${dy*30}px)`}
  else if(o.m==='l'){me.yaw-=(t.clientX-o.x)*.006;me.pitch=Math.max(-1.3,Math.min(1.3,me.pitch-(t.clientY-o.y)*.006));o.x=t.clientX;o.y=t.clientY}}
 e.preventDefault()},{passive:false});
const tend=e=>{for(const t of e.changedTouches){const o=T[t.identifier];if(!o)continue;
 if(o.m==='f')firing=false;if(o.m==='j'){mv.x=mv.y=0;jb.style.display='none';jk.style.transform=''}delete T[t.identifier]}};
document.addEventListener('touchend',tend);document.addEventListener('touchcancel',tend);

/* ---------- حلقه ---------- */
let last=performance.now(),netT=0;
function loop(now){requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.05);last=now;
 if(playing&&!over){
  const sp=6*dt,fx=-Math.sin(me.yaw),fz=-Math.cos(me.yaw),rx=Math.cos(me.yaw),rz=-Math.sin(me.yaw);
  me.x+=(fx*-mv.y+rx*mv.x)*sp;me.z+=(fz*-mv.y+rz*mv.x)*sp;collide();
  if(firing)shoot();
  netT+=dt;if(netT>.066){netT=0;send({t:'s',x:me.x,z:me.z,y:me.yaw})}
  R.x+=(R.tx-R.x)*Math.min(1,dt*12);R.z+=(R.tz-R.z)*Math.min(1,dt*12);R.y=R.ty;
  opp.position.set(R.x,0,R.z);opp.rotation.y=R.y}
 cam.position.set(me.x,1.6,me.z);cam.rotation.set(me.pitch,me.yaw,0);
 stepShots(dt);ren.render(scene,cam)}
requestAnimationFrame(loop);
</script>
</body>
</html>
