<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>نبرد آب‌پاش</title>
<style>
:root{--sea:#0a3d5c;--aqua:#2ec4ff;--sun:#ffc531;--ink:#06202f}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:Tahoma,"Vazirmatn",sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 0,#1486b8,var(--sea) 55%,var(--ink));z-index:10;text-align:center;padding:12px;overflow:auto}
h1{margin:0;font-size:36px;color:var(--sun);text-shadow:0 4px 0 #b8801a}
p{margin:0;opacity:.85;font-size:14px}
button,input{font:inherit;border:0;border-radius:16px;padding:11px 20px;font-size:17px}
button{background:var(--sun);color:var(--ink);font-weight:bold;box-shadow:0 4px 0 #b8801a}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8801a}
.bn{background:var(--aqua);box-shadow:0 4px 0 #1a7fa8;width:64px;padding:11px 0}
input{text-align:center;width:120px;letter-spacing:8px;direction:ltr;background:#fff;color:var(--ink)}
.mp{background:#ffffff30;color:#fff;box-shadow:none;padding:8px 13px;font-size:14px}
.mp.on{background:var(--sun);color:var(--ink)}
.row{display:flex;gap:10px;align-items:center}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
#hpw{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:42%;height:12px;background:#0007;border-radius:8px;overflow:hidden}
#hp{height:100%;width:100%;background:var(--aqua);transition:width .15s}
#sc{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));width:100%;text-align:center;font-size:18px;font-weight:bold;text-shadow:0 2px 4px #000}
#wn{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:16px;font-weight:bold;text-shadow:0 2px 4px #000;background:#0005;padding:3px 14px;border-radius:12px}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid #fff;border-radius:50%;opacity:.85}
.bt{position:absolute;border-radius:50%;background:#ffffff40;border:3px solid #fff;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;text-shadow:0 1px 3px #000}
#fire{right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:92px;height:92px;background:#ffc531cc;color:var(--ink);text-shadow:none;font-size:18px}
#jump{right:calc(132px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:68px;height:68px}
#swap{right:calc(40px + env(safe-area-inset-right,0px));bottom:calc(138px + env(safe-area-inset-bottom,0px));width:66px;height:66px}
#jb{position:absolute;width:100px;height:100px;margin:-50px;border-radius:50%;border:3px solid #fff8;display:none}
#jk{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fffb}
#hit{position:fixed;inset:0;background:#ff2d2d;opacity:0;transition:opacity .25s;pointer-events:none;z-index:4}
#msg{position:fixed;top:38%;width:100%;text-align:center;font-size:26px;font-weight:bold;z-index:6;pointer-events:none;text-shadow:0 2px 6px #000}
</style>
</head>
<body>
<div id="menu">
  <h1>نبرد آب‌پاش</h1>
  <p>زمین بازی (برای اتاق آنلاین هم همین)</p>
  <div class="row"><button class="mp on" data-i="0">استخر</button><button class="mp" data-i="1">کارگاه</button><button class="mp" data-i="2">نئون</button><button class="mp" data-i="3">برفی</button></div>
  <p>تک‌نفره: با چند ربات بجنگی؟ (۲۰ تا خیس کن)</p>
  <div class="row"><button class="bn" data-n="3">۳</button><button class="bn" data-n="5">۵</button><button class="bn" data-n="8">۸</button></div>
  <p>آنلاین دو نفره: اول کسی که ۵ بار خیس کنه می‌بره</p>
  <button id="mk">ساخت اتاق</button>
  <div class="row"><input id="code" inputmode="numeric" maxlength="4" placeholder="----"><button id="jn">ورود</button></div>
  <p id="st">گوشی رو افقی بگیر</p>
</div>
<div id="hud">
  <div id="hpw"><div id="hp"></div></div>
  <div id="sc"></div>
  <div id="cross"></div>
  <div id="jb"><div id="jk"></div></div>
  <div id="wn"></div>
  <div id="swap" class="bt">تعویض</div>
  <div id="jump" class="bt">پرش</div>
  <div id="fire" class="bt">آب!</div>
</div>
<div id="hit"></div>
<div id="msg"></div>

  if(k==='snowman'||k==='tree'){m=new THREE.Group();m.position.set(x,0,z);
   if(k==='tree'){P(m,G.cyl,0x6b4a2a,[.2,1,.2],[0,.5,0]);P(m,G.cone,0x2e7d4f,[1.2,1.8,1.2],[0,1.7,0]);P(m,G.cone,0x378a58,[.9,1.5,.9],[0,2.9,0]);P(m,G.cone,0x3f9a63,[.6,1.2,.6],[0,3.8,0])}
   else{P(m,G.sph,0xffffff,[.55,.55,.55],[0,.55,0]);P(m,G.sph,0xffffff,[.4,.4,.4],[0,1.35,0]);P(m,G.sph,0xffffff,[.28,.28,.28],[0,1.9,0]);P(m,G.box,0xff8c1a,[.06,.06,.25],[0,1.9,-.3]);P(m,G.box,0xd63031,[.5,.08,.5],[0,1.62,0])}
   m.traverse(o=>o.castShadow=true)}
  else{m=k.startsWith('barrel')?new THREE.Mesh(new THREE.CylinderGeometry(w/2,w/2,h,14),mat(k.slice(7))):new THREE.Mesh(G.box,boxMat(k,w,h,d));
   if(!k.startsWith('barrel'))m.scale.set(w,h,d);m.position.set(x,h/2,z);m.castShadow=m.receiveShadow=true}
  mapG.add(m)}
 for(const [x,z,w,d] of [[0,-30.5,60,1],[0,30.5,60,1],[-30.5,0,1,60],[30.5,0,1,60]]){const m=new THREE.Mesh(G.box,boxMat(M.wall,w,4,d));m.scale.set(w,4,d);m.position.set(x,2,z);m.receiveShadow=true;mapG.add(m)}
 if(M.deco)M.deco(mapG)}
buildMap(0);

/* ---------- فیزیک ---------- */
function groundAt(x,z,y){let g=0;for(const b of B)if(Math.abs(x-b[0])<b[2]/2+.25&&Math.abs(z-b[1])<b[4]/2+.25&&b[3]<=y+.4&&b[3]>g)g=b[3];return g}
function collide(o){o.x=Math.max(-28.6,Math.min(28.6,o.x));o.z=Math.max(-28.6,Math.min(28.6,o.z));
 for(const [x,z,w,h,d] of B){if(h<=o.y+.4)continue;const ox=w/2+.4-Math.abs(o.x-x),oz=d/2+.4-Math.abs(o.z-z);
  if(ox>0&&oz>0){if(ox<oz)o.x+=ox*Math.sign(o.x-x||1);else o.z+=oz*Math.sign(o.z-z||1)}}}
function phys(o,dt){const g=groundAt(o.x,o.z,o.y);o.vy-=GRAV*dt;o.y+=o.vy*dt;if(o.y<=g){o.y=g;o.vy=0;o.on=true}else o.on=false}

/* ---------- کاراکتر ---------- */
function mkChar(shirt,pants,cap){
 const g=new THREE.Group(),skin=0xf0c29b;
 P(g,G.box,shirt,[.5,.6,.28],[0,1.05,0]);P(g,G.sph,skin,[.17,.19,.17],[0,1.52,0]);
 P(g,G.box,cap,[.38,.09,.38],[0,1.68,0]);P(g,G.box,cap,[.3,.05,.2],[0,1.64,-.24]);P(g,G.box,0x111111,[.32,.07,.05],[0,1.54,-.15]);
 P(g,G.cyl,0x2ec4ff,[.13,.4,.13],[0,1.1,.22]);
 const leg=x=>{const l=new THREE.Group();l.position.set(x,.75,0);P(l,G.box,pants,[.18,.7,.18],[0,-.35,0]);P(l,G.box,0xffffff,[.2,.1,.26],[0,-.72,-.03]);g.add(l);return l};
 const lL=leg(-.13),lR=leg(.13);
 for(const [x,r] of [[-.34,1.25],[.34,1.35]]){const a=new THREE.Group();a.position.set(x,1.32,0);P(a,G.box,skin,[.12,.5,.12],[0,-.22,0]);a.rotation.x=r;g.add(a)}
 P(g,G.box,0xffc531,[.1,.14,.5],[.3,1.2,-.6]);P(g,G.cyl,0x2ec4ff,[.06,.1,.06],[.3,1.32,-.5]);
 g.traverse(o=>o.castShadow=true);scene.add(g);return{g,lL,lR,ph:0}}
function walk(c,dt,moving){if(moving){c.ph+=dt*10;const s=Math.sin(c.ph)*.8;c.lL.rotation.x=s;c.lR.rotation.x=-s}else{c.lL.rotation.x*=.8;c.lR.rotation.x*=.8}}

/* ---------- سلاح‌ها ---------- */
const W=[{n:'تپانچه',r:140,d:9,s:42,sp:.015,c:1,col:0xffc531},{n:'مسلسل',r:65,d:4,s:38,sp:.05,c:1,col:0x2ecc71},
 {n:'شاتگان',r:700,d:5,s:32,sp:.12,c:8,col:0xe74c3c},{n:'اسنایپر',r:950,d:40,s:85,sp:0,c:1,col:0x9b59b6,z:38}];
const gunRoot=new THREE.Group();gunRoot.position.set(.3,-.27,-.6);cam.add(gunRoot);
const VM=W.map(()=>{const g=new THREE.Group();g.visible=false;gunRoot.add(g);return g});
{const w=0x2ec4ff;
 P(VM[0],G.box,W[0].col,[.1,.14,.42],[0,0,0]);P(VM[0],G.box,W[0].col,[.08,.2,.1],[0,-.14,.12]);P(VM[0],G.cyl,w,[.07,.12,.07],[0,.13,.04]);
 P(VM[1],G.box,W[1].col,[.1,.14,.65],[0,0,0]);P(VM[1],G.box,0x222222,[.07,.22,.1],[0,-.17,.05]);P(VM[1],G.cyl,w,[.08,.13,.08],[0,.14,.1]);P(VM[1],G.box,0x222222,[.05,.05,.2],[0,.02,-.4]);
 P(VM[2],G.box,0x333333,[.07,.07,.9],[0,.03,-.2]);P(VM[2],G.box,0x8a5a2b,[.12,.1,.28],[0,-.04,-.1]);P(VM[2],G.box,0x8a5a2b,[.1,.14,.3],[0,-.03,.4]);P(VM[2],G.cyl,W[2].col,[.12,.2,.12],[0,.15,.2]);
 P(VM[3],G.box,W[3].col,[.08,.1,1.05],[0,0,0]);P(VM[3],G.box,0x111111,[.06,.07,.32],[0,.1,-.05]);P(VM[3],G.box,W[3].col,[.09,.15,.35],[0,-.04,.58]);P(VM[3],G.cyl,w,[.07,.12,.07],[0,.1,.3])}
let wi=0;
function setW(i){wi=((i%W.length)+W.length)%W.length;VM.forEach((g,k)=>g.visible=k===wi);cam.fov=W[wi].z||75;cam.updateProjectionMatrix();$('wn').textContent=W[wi].n}
const swapW=()=>setW(wi+1);

/* ---------- بازیکن و ربات ---------- */
const me={x:0,z:22,y:0,vy:0,on:true,yaw:0,pitch:0,hp:100};
let myScore=0,oppScore=0,deaths=0,mv={x:0,y:0},firing=false,lastShot=0;
const hpUI=()=>$('hp').style.width=Math.max(me.hp,0)+'%';
const scUI=()=>$('sc').textContent=single?`خیس‌کرده: ${fa(myScore)} از ${fa(GOAL)} · خیس‌شده: ${fa(deaths)}`:`${fa(myScore)} : ${fa(oppScore)}`;
function spawn(){me.x=0;me.z=isHost?22:-22;me.y=0;me.vy=0;me.yaw=isHost?0:Math.PI;me.pitch=0;me.hp=100;hpUI()}
const jump=()=>{if(playing&&!over&&me.on)me.vy=JUMP};

const opp=mkChar(0xff5a5f,0x2c3e50,0xffffff);opp.g.visible=false;
const R={x:0,z:0,y:0,h:0,tx:0,tz:0,ty:0,th:0};
const BC=[[0xff5a5f,0x2c3e50,0xffffff],[0x2ecc71,0x34495e,0xf1c40f],[0xf39c12,0x1f3a5f,0x2c3e50],[0x9b59b6,0x2c3e50,0xe74c3c],[0x1abc9c,0x3b3b3b,0xffffff],[0xe84393,0x2c3e50,0xffeaa7],[0x3498db,0x2d3436,0xff7675],[0xd35400,0x2c3e50,0xdfe6e9]];
const SP=[[-24,-24],[24,-24],[-24,24],[24,24],[-26,0],[26,0],[0,-25],[0,25]];
const bots=[];
function makeBots(n){for(let i=0;i<n;i++){const c=mkChar(...BC[i%BC.length]);const b=Object.assign(c,{x:0,z:0,y:0,vy:0,on:true,yaw:0,hp:60,alive:true,t:0,sx:1,fire:1,jt:2,rt:0,pref:8+Math.random()*8});bots.push(b);botSpawn(b)}}
function botSpawn(b){const f=SP.filter(p=>Math.hypot(p[0]-me.x,p[1]-me.z)>16),p=f[Math.floor(Math.random()*f.length)]||SP[0];
 b.x=p[0];b.z=p[1];b.y=0;b.vy=0;b.hp=60;b.alive=true;b.g.visible=true;b.fire=1+Math.random()}
function botHit(b,d){hitMark();b.hp-=d;if(b.hp<=0&&b.alive){b.alive=false;b.g.visible=false;b.rt=2.5;myScore++;scUI();if(myScore>=GOAL)end(true);else note('خیسش کردی!')}}
function clearLine(b){const e1=b.y+1.3,e2=me.y+1.4;for(let i=1;i<10;i++){const k=i/10,x=b.x+(me.x-b.x)*k,z=b.z+(me.z-b.z)*k,e=e1+(e2-e1)*k;
 for(const [bx,bz,w,h,d] of B)if(Math.abs(x-bx)<w/2&&Math.abs(z-bz)<d/2&&h>e)return false}return true}
function botStep(b,dt){
 if(!b.alive){b.rt-=dt;if(b.rt<=0)botSpawn(b);return}
 const dx=me.x-b.x,dz=me.z-b.z,dist=Math.hypot(dx,dz);b.yaw=Math.atan2(-dx,-dz);
 b.t-=dt;if(b.t<0){b.t=.7+Math.random()*1.3;b.sx=Math.random()<.5?-1:1}
 const f=dist>b.pref+3?1:dist<b.pref-3?-1:0,sp=5*dt,fx=-Math.sin(b.yaw),fz=-Math.cos(b.yaw),rx=Math.cos(b.yaw),rz=-Math.sin(b.yaw);
 b.x+=(fx*f+rx*b.sx*.7)*sp;b.z+=(fz*f+rz*b.sx*.7)*sp;collide(b);
 b.jt-=dt;if(b.jt<0&&b.on){b.vy=JUMP;b.jt=2+Math.random()*3}
 phys(b,dt);b.fire-=dt;
 if(dist<32&&b.fire<=0&&clearLine(b)){b.fire=.55+Math.random()*.6;
  const o=new THREE.Vector3(b.x,b.y+1.3,b.z),t=new THREE.Vector3(me.x+(Math.random()-.5)*1.5,me.y+1.1+.5*7*(dist/30)**2,me.z+(Math.random()-.5)*1.5);
  const d=t.sub(o).normalize();o.addScaledVector(d,.8);addShot(o.toArray(),d.toArray(),false,true,30,3)}
 walk(b,dt,b.on);b.g.position.set(b.x,b.y,b.z);b.g.rotation.y=b.yaw}

/* ---------- آب ---------- */
const bGeo=new THREE.SphereGeometry(.09,6,6),bMat=new THREE.MeshBasicMaterial({color:0x4fd1ff});
const shots=[],sp=[],sGeo=new THREE.SphereGeometry(.05,4,4),sMat=new THREE.MeshBasicMaterial({color:0xaee8ff});
function addShot(o,d,mine,bot,spd,dmg){const m=new THREE.Mesh(bGeo,bMat);m.position.fromArray(o);scene.add(m);
 shots.push({m,v:new THREE.Vector3().fromArray(d).multiplyScalar(spd),mine,bot,dmg,t:0})}
function splash(p){for(let i=0;i<4;i++){const m=new THREE.Mesh(sGeo,sMat);m.position.copy(p);scene.add(m);sp.push({m,v:new THREE.Vector3((Math.random()-.5)*3,Math.random()*3+1,(Math.random()-.5)*3),t:0})}}
function hitMark(){const c=$('cross');c.style.borderColor='#ff3b3b';setTimeout(()=>c.style.borderColor='#fff',120)}
function shoot(){
 const w=W[wi],now=performance.now();if(now-lastShot<w.r)return;lastShot=now;
 const d0=new THREE.Vector3();cam.getWorldDirection(d0);
 const o=[cam.position.x+d0.x*.8,cam.position.y-.12+d0.y*.8,cam.position.z+d0.z*.8],ds=[];
 for(let i=0;i<w.c;i++){const d=d0.clone();d.x+=(Math.random()-.5)*w.sp*2;d.y+=(Math.random()-.5)*w.sp*2;d.z+=(Math.random()-.5)*w.sp*2;d.normalize();ds.push(d.toArray());addShot(o,d.toArray(),true,false,w.s,w.d)}
 send({t:'f',o,ds,s:w.s});gunRoot.position.z=-.5;setTimeout(()=>gunRoot.position.z=-.6,60)}
function stepShots(dt){
 for(let i=shots.length-1;i>=0;i--){const s=shots[i],p=s.m.position,n=Math.ceil(s.v.length()*dt/.35),h=dt/n;let dead=false;
  for(let k=0;k<n&&!dead;k++){
   s.v.y-=7*h;p.addScaledVector(s.v,h);s.t+=h;
   dead=s.t>3||p.y<.05||Math.abs(p.x)>30||Math.abs(p.z)>30;
   if(!dead)for(const [x,z,w,hh,d] of B)if(Math.abs(p.x-x)<w/2&&Math.abs(p.z-z)<d/2&&p.y<hh){dead=true;break}
   if(!dead&&s.mine){
    if(single){for(const b of bots)if(b.alive&&Math.hypot(p.x-b.x,p.z-b.z)<.5&&p.y>b.y&&p.y<b.y+1.8){dead=true;botHit(b,s.dmg);break}}
    else if(opp.g.visible&&Math.hypot(p.x-R.x,p.z-R.z)<.5&&p.y>R.h&&p.y<R.h+1.8){dead=true;hitMark();send({t:'h',d:s.dmg})}}
   if(!dead&&s.bot&&Math.hypot(p.x-me.x,p.z-me.z)<.5&&p.y>me.y&&p.y<me.y+1.8){dead=true;hitMe(s.dmg)}}
  if(dead){splash(p);scene.remove(s.m);shots.splice(i,1)}}
 for(let i=sp.length-1;i>=0;i--){const s=sp[i];s.v.y-=12*dt;s.m.position.addScaledVector(s.v,dt);s.t+=dt;if(s.t>.4){scene.remove(s.m);sp.splice(i,1)}}}

/* ---------- شبکه و قوانین ---------- */
const send=o=>{if(conn&&conn.open)conn.send(o)};
function hitMe(d){if(!playing||over)return;d=Math.min(Math.max(+d||0,0),45);me.hp-=d;hpUI();$('hit').style.opacity=.4;setTimeout(()=>$('hit').style.opacity=0,120);
 if(me.hp<=0){if(single){deaths++;scUI();note('خیس شدی!');spawn()}else{oppScore++;scUI();send({t:'d'});if(oppScore>=5)end(false);else{note('خیس شدی!');spawn()}}}}
function oppDied(){if(over)return;myScore++;scUI();if(myScore>=5)end(true);else note('خیسش کردی!')}
function onData(m){
 if(!m||typeof m!=='object')return;
 if(m.t==='s'&&isFinite(m.x)&&isFinite(m.z)){R.tx=m.x;R.tz=m.z;R.ty=m.y;R.th=+m.h||0;if(!opp.g.visible){R.x=m.x;R.z=m.z;R.h=R.th;opp.g.visible=true}}
 else if(m.t==='f'&&Array.isArray(m.o)&&m.o.length===3&&Array.isArray(m.ds)){const s=Math.min(Math.max(+m.s||30,20),100);m.ds.slice(0,10).forEach(d=>Array.isArray(d)&&d.length===3&&addShot(m.o,d,false,false,s,0))}
 else if(m.t==='m'){if(!playing&&Number.isInteger(m.i)&&m.i>=0&&m.i<MAPS.length){buildMap(m.i);start()}}
 else if(m.t==='h')hitMe(m.d);
 else if(m.t==='d')oppDied()}
function setup(c){conn=c;c.on('data',onData);c.on('close',()=>{if(!over)note('ارتباط قطع شد',true);playing=false});if(isHost){const go=()=>{send({t:'m',i:mapI});start()};c.open?go():c.on('open',go)}}
function note(t,keep){const e=$('msg');e.textContent=t;if(!keep)setTimeout(()=>{if(e.textContent===t)e.textContent=''},1400)}
function end(win){over=true;firing=false;$('msg').innerHTML=(win?'بردی! 🎉':'باختی 😅')+'<br><button style="pointer-events:auto;margin-top:14px" onclick="location.reload()">بازی دوباره</button>'}
function start(){$('menu').style.display='none';$('hud').style.display='block';spawn();setW(0);scUI();playing=true}
const st=t=>$('st').textContent=t;
let lan=false;
fetch('lan-ping').then(r=>r.text()).then(t=>{if(t==='ok'){lan=true;st('حالت وای‌فای محلی فعاله ✅ (بدون اینترنت)')}}).catch(()=>{});
function needPeer(cb){if(window.Peer)return cb();st('در حال آماده‌سازی اتصال...');const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';e.onload=cb;
 e.onerror=()=>st('اینترنت در دسترس نیست. اگه کنار هم هستید از سرور وای‌فای محلی استفاده کنید');document.head.appendChild(e)}
function lanConn(code,mode,err){
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+code+'&mode='+mode),h={data:[],close:[],open:[]};
 const c={open:false,send:o=>{if(ws.readyState===1)ws.send(JSON.stringify(o))},on:(e,f)=>h[e].push(f)};
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch{return}
  if(m.__){if(m.__==='peer'){c.open=true;h.open.forEach(f=>f())}else if(m.__==='left'){c.open=false;h.close.forEach(f=>f())}else err(m.__);return}
  h.data.forEach(f=>f(m))};
 ws.onclose=()=>{if(c.open){c.open=false;h.close.forEach(f=>f())}};ws.onerror=()=>err('ws');return c}
function host(){isHost=true;buildMap(mapSel);const code=String(1000+Math.floor(Math.random()*9000));
 const ok=()=>{st('کد اتاق: '+code+' — این کد رو به دوستت بده و منتظر بمون');$('mk').disabled=true};
 if(lan){setup(lanConn(code,'host',e=>e==='taken'?host():st('خطا در اتصال به سرور')));ok();return}
 needPeer(()=>{const p=new Peer('wgun-'+code);p.on('open',ok);p.on('connection',setup);p.on('error',e=>{if(e.type==='unavailable-id')host();else st('خطا در اتصال: '+e.type)})})}
function join(){const code=$('code').value.trim();if(code.length!==4)return st('کد ۴ رقمی رو بنویس');st('در حال اتصال...');
 if(lan)return setup(lanConn(code,'join',e=>st(e==='nope'?'اتاقی با این کد پیدا نشد':'خطا در اتصال به سرور')));
 needPeer(()=>{const p=new Peer();p.on('open',()=>setup(p.connect('wgun-'+code,{reliable:true})));p.on('error',e=>st(e.type==='peer-unavailable'?'اتاقی با این کد پیدا نشد':'خطا در اتصال: '+e.type))})}
$('mk').onclick=host;$('jn').onclick=join;
document.querySelectorAll('.bn').forEach(b=>b.onclick=()=>{single=true;isHost=true;buildMap(mapSel);makeBots(+b.dataset.n);start()});
document.querySelectorAll('.mp').forEach(b=>b.onclick=()=>{mapSel=+b.dataset.i;document.querySelectorAll('.mp').forEach(x=>x.classList.toggle('on',x===b));buildMap(mapSel)});

/* ---------- کنترل لمسی ---------- */
const TT={},jb=$('jb'),jk=$('jk');
document.addEventListener('touchstart',e=>{if(!playing||over)return;
 for(const t of e.changedTouches){const id=t.target.id;
  if(id==='fire'){TT[t.identifier]={m:'f'};firing=true}
  else if(id==='jump'){TT[t.identifier]={m:'b'};jump()}
  else if(id==='swap'){TT[t.identifier]={m:'b'};swapW()}
  else if(t.clientX<innerWidth/2){TT[t.identifier]={m:'j',x:t.clientX,y:t.clientY};jb.style.display='block';jb.style.left=t.clientX+'px';jb.style.top=t.clientY+'px'}
  else TT[t.identifier]={m:'l',x:t.clientX,y:t.clientY}}
 e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{
 for(const t of e.changedTouches){const o=TT[t.identifier];if(!o)continue;
  if(o.m==='j'){let dx=(t.clientX-o.x)/45,dy=(t.clientY-o.y)/45;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}mv.x=dx;mv.y=dy;jk.style.transform=`translate(${dx*30}px,${dy*30}px)`}
  else if(o.m==='l'){me.yaw-=(t.clientX-o.x)*.009;me.pitch=Math.max(-1.3,Math.min(1.3,me.pitch-(t.clientY-o.y)*.009));o.x=t.clientX;o.y=t.clientY}}
 e.preventDefault()},{passive:false});
const tend=e=>{for(const t of e.changedTouches){const o=TT[t.identifier];if(!o)continue;
 if(o.m==='f')firing=false;if(o.m==='j'){mv.x=mv.y=0;jb.style.display='none';jk.style.transform=''}delete TT[t.identifier]}};
document.addEventListener('touchend',tend);document.addEventListener('touchcancel',tend);

/* ---------- حلقه ---------- */
let last=performance.now(),netT=0,mph=0;
function loop(now){requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.05);last=now;
 if(playing&&!over){
  const sp=SPEED*dt,fx=-Math.sin(me.yaw),fz=-Math.cos(me.yaw),rx=Math.cos(me.yaw),rz=-Math.sin(me.yaw);
  me.x+=(fx*-mv.y+rx*mv.x)*sp;me.z+=(fz*-mv.y+rz*mv.x)*sp;collide(me);phys(me,dt);
  if(firing)shoot();
  if(single)bots.forEach(b=>botStep(b,dt));
  else{netT+=dt;if(netT>.05){netT=0;send({t:'s',x:me.x,z:me.z,y:me.yaw,h:me.y})}
   const k=Math.min(1,dt*14),mvg=Math.hypot(R.tx-R.x,R.tz-R.z)>.05;R.x+=(R.tx-R.x)*k;R.z+=(R.tz-R.z)*k;R.h+=(R.th-R.h)*k;R.y=R.ty;
   opp.g.position.set(R.x,R.h,R.z);opp.g.rotation.y=R.y;walk(opp,dt,mvg)}}
 cam.position.set(me.x,me.y+1.6,me.z);cam.rotation.set(me.pitch,me.yaw,0);
 stepShots(dt);ren.render(scene,cam)}
requestAnimationFrame(loop);
</script>
